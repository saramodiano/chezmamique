<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chez Mamique — Family Recipes</title>
<meta name="description" content="Mamimonique's handwritten recipes, in French and English, organized by course.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="page">

  <header class="site-header">
    <h1 class="site-title"><a href="#/">Chez Mamique</a></h1>
    <p class="site-tagline">Family recipes from Mamimonique's kitchen, in French and in English</p>
  </header>

  <nav class="site-nav" id="site-nav">
    <!-- filled in by main.js -->
  </nav>

  <div class="search-bar">
    <form id="search-form">
      <label for="search">Search the recipes:</label>
      <input type="search" id="search" placeholder="e.g. tarte, chicken, orbey" autocomplete="off">
      <button type="submit">Search</button>
    </form>
  </div>

  <hr>

  <main id="app"></main>

  <hr>

  <footer class="site-footer">
    <p>Typed out, translated and kept, from a lifetime of cooking. Handwriting is not always perfect, and
    neither is a translation here and there — but every recipe here stays true to the original page.</p>
  </footer>

</div>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
</body>
</html>
